name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    name: Offline site and worker checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check Python source syntax
        run: python -m py_compile build.py content.py tools/og.py tools/check_site.py
      - name: Check browser and worker JS syntax
        run: |
          node --check site/assets/scan.js
          node --check worker/src/index.js
      - name: Check committed site integrity
        run: python tools/check_site.py
      - name: Test validator with synthetic positive and negative fixtures
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run worker security and behavior tests
        working-directory: worker
        run: npm test
